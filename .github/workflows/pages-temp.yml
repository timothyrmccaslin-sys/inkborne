# TEMPORARY deploy-only workflow (Rick, Deployment).
# Ships the committed site straight to GitHub Pages on every push to main.
# Replace with team/dev/templates/.github/workflows/deploy.yml once Brandon's
# "CI" workflow (which uploads a `dist` artifact) is in the repo, then delete this file.
# Uses only the default GITHUB_TOKEN. No secrets.
name: Pages (temporary)

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version sync (APP_VERSION == sw.js VERSION)
        run: |
          if [ -f src/main.js ] && [ -f sw.js ]; then
            bash tools/check-version-sync.sh src/main.js sw.js
          else
            echo "src/main.js or sw.js not present yet; skipping version check."
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'team' --exclude 'core' --exclude 'tools' --exclude 'tests' \
            --exclude 'build.sh' ./ _site/
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
